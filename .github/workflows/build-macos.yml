name: Build macOS (Mad Dog Sniffer)

# Compila o Mad Dog Sniffer para macOS em runners nativos da Apple —
# macOS não é cross-compilável a partir de Windows.
#
# COMO USAR:
#   1. Rode este workflow manualmente (Actions → Build macOS → Run workflow)
#      ou crie uma tag v* para disparo automático
#   2. Baixe os artefatos (binários macOS Intel + Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac -> x86_64 (macos-15-intel é o rótulo atual; macos-13 foi aposentado em dez/2025)
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # Apple Silicon (M1/M2/M3/M4) -> arm64
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        # libpcap já vem no macOS — nenhuma dependência extra é necessária
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (mad dog)
        run: |
          cp target/${{ matrix.target }}/release/sniffnet \
             MadDog-Sniffer-${{ matrix.target }}
          chmod +x MadDog-Sniffer-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maddog-sniffer-${{ matrix.target }}
          path: MadDog-Sniffer-${{ matrix.target }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            maddog-sniffer-*/*-apple-darwin
          generate_release_notes: true
