name: Build macOS (Sniffnet Cyberpunk)

# Compila o Sniffnet (com tema Cyberpunk embutido) para macOS em runners
# nativos da Apple — macOS não é cross-compilável a partir de Windows.
#
# COMO USAR:
#   1. Faça fork deste repositório no seu GitHub
#   2. Faça push (o tema cyberpunk já está no código)
#   3. Rode este workflow manualmente (Actions → Build macOS → Run workflow)
#      ou crie uma tag v* para disparo automático
#   4. Baixe os artefatos (binários macOS Intel + Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac -> x86_64 (macos-15-intel é o rótulo atual; macos-13 foi aposentado em dez/2025)
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # Apple Silicon (M1/M2/M3/M4) -> arm64
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        # libpcap já vem no macOS — nenhuma dependência extra é necessária
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (cyberpunk)
        run: |
          cp target/${{ matrix.target }}/release/sniffnet \
             Sniffnet-Cyberpunk-${{ matrix.target }}
          chmod +x Sniffnet-Cyberpunk-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniffnet-cyberpunk-${{ matrix.target }}
          path: Sniffnet-Cyberpunk-${{ matrix.target }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sniffnet-cyberpunk-*/*-apple-darwin
          generate_release_notes: true
